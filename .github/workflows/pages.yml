# GitHub Pages deployment workflow — ACTIVE (Phase 6, user-authorized 2026-08-11)
#
# Deploys the sanitized public projection of the Ix-findings knowledge
# explorer to GitHub Pages. The workflow regenerates canonical data, builds
# the sanitized public projection, validates it, then deploys.
# See planning/pages/README.md and planning/pages/validate-public.mjs.
name: pages

on:
  push:
    branches: [master]
    paths:
      - 'planning/**'
      - 'CLI-HANDOFF/manifest.json'
      - 'pr-packets/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate canonical data
        run: node planning/wiki/build-data.mjs
      - name: Build sanitized public projection
        run: node planning/pages/build-public.mjs
      - name: Validate public projection
        run: node planning/pages/validate-public.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: planning/pages/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
